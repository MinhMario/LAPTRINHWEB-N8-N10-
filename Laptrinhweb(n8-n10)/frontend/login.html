<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập | PTIT StudentHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
</head>
<body style="background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);">
  <!-- Header Navbar điều hướng -->
  <header class="site-header"></header>

  <main class="container auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon-wrapper">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
        <h1 class="auth-title">Đăng nhập</h1>
        <p class="auth-subtitle">Cổng thông tin hồ sơ sinh viên PTIT</p>
      </div>

      <!-- Vùng thông báo lỗi chung của form -->
      <div id="form-error"></div>

      <!-- Form Đăng nhập -->
      <form id="login-form" novalidate>
        <!-- Tên đăng nhập / Mã SV -->
        <div class="form-group">
          <label class="form-label" for="username">Tên đăng nhập / Mã sinh viên <span class="required">*</span></label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            class="form-control" 
            placeholder="Ví dụ: B24DTCN001 hoặc admin" 
            required 
            autocomplete="username"
          >
          <span class="field-error" data-error-for="username"></span>
        </div>

        <!-- Mật khẩu -->
        <div class="form-group">
          <label class="form-label" for="password">Mật khẩu <span class="required">*</span></label>
          <div style="position: relative;">
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-control" 
              placeholder="Nhập mật khẩu..." 
              required 
              autocomplete="current-password"
              style="padding-right: 42px;"
            >
            <button 
              type="button" 
              id="btn-toggle-password" 
              style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--color-text-muted); padding: 4px;"
              title="Hiện/Ẩn mật khẩu"
            >
              👁️
            </button>
          </div>
          <span class="field-error" data-error-for="password"></span>
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
          Đăng nhập hệ thống
        </button>
      </form>

      <!-- Hộp gợi ý tài khoản mẫu để test tiện lợi -->
      <div class="sample-accounts-box">
        <details>
          <summary>💡 Gợi ý tài khoản mẫu từ schema.sql</summary>
          <div class="sample-accounts-list">
            <p style="margin-bottom: 6px; font-weight: 600;">Bấm nhanh để điền:</p>
            <div style="display: flex; flex-direction: column; gap: 4px;">
              <button type="button" class="sample-btn" data-user="admin" data-pass="123456">
                <strong>Admin:</strong> admin / 123456
              </button>
              <button type="button" class="sample-btn" data-user="B24DTCN001" data-pass="Ptit@2026">
                <strong>Sinh viên:</strong> B24DTCN001 / Ptit@2026 (vào thẳng)
              </button>
              <button type="button" class="sample-btn" data-user="B24DTCN002" data-pass="Ptit@2026">
                <strong>Sinh viên 2:</strong> B24DTCN002 / Ptit@2026 (yêu cầu đổi MK)
              </button>
            </div>
          </div>
        </details>
      </div>
    </div>
  </main>

  <footer class="site-footer"></footer>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>

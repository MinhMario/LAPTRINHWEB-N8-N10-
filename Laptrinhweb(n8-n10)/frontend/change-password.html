<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đổi mật khẩu | PTIT StudentHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
</head>
<body style="background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);">
  <!-- Header Navbar điều hướng -->
  <header class="site-header"></header>

  <main class="container auth-page">
    <div class="auth-card" style="max-width: 480px;">
      <div class="auth-header">
        <div class="auth-icon-wrapper" style="background: #fff8e1; color: var(--color-warning);">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </div>
        <h1 class="auth-title">Đổi mật khẩu</h1>
        <p class="auth-subtitle">Cập nhật mật khẩu để bảo vệ an toàn tài khoản</p>
      </div>

      <!-- Banner cảnh báo đổi mật khẩu lần đầu nếu có -->
      <div id="first-login-alert" class="alert-banner alert-banner-warning" style="display: none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        <span>Đây là lần đầu đăng nhập. Bạn cần thiết lập mật khẩu mới trước khi truy cập các tính năng.</span>
      </div>

      <!-- Vùng thông báo lỗi chung -->
      <div id="form-error"></div>

      <!-- Form Đổi mật khẩu -->
      <form id="password-form" novalidate>
        <!-- Mật khẩu hiện tại -->
        <div class="form-group">
          <label class="form-label" for="current_password">Mật khẩu hiện tại <span class="required">*</span></label>
          <input 
            type="password" 
            id="current_password" 
            name="current_password" 
            class="form-control" 
            placeholder="Nhập mật khẩu hiện tại..." 
            required
            autocomplete="current-password"
          >
          <span class="field-error" data-error-for="current_password"></span>
        </div>

        <!-- Mật khẩu mới -->
        <div class="form-group">
          <label class="form-label" for="new_password">Mật khẩu mới <span class="required">*</span></label>
          <input 
            type="password" 
            id="new_password" 
            name="new_password" 
            class="form-control" 
            placeholder="Tối thiểu 8 ký tự, khác mật khẩu cũ..." 
            required
            autocomplete="new-password"
          >
          <span class="field-error" data-error-for="new_password"></span>
          <small style="color: var(--color-text-muted); font-size: 0.8rem; display: block; margin-top: 2px;">
            Yêu cầu: Từ 8 ký tự trở lên và không trùng với mật khẩu cũ.
          </small>
        </div>

        <!-- Xác nhận mật khẩu mới -->
        <div class="form-group">
          <label class="form-label" for="confirm_password">Xác nhận mật khẩu mới <span class="required">*</span></label>
          <input 
            type="password" 
            id="confirm_password" 
            name="confirm_password" 
            class="form-control" 
            placeholder="Nhập lại mật khẩu mới..." 
            required
            autocomplete="new-password"
          >
          <span class="field-error" data-error-for="confirm_password"></span>
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
          Lưu mật khẩu mới
        </button>
      </form>
    </div>
  </main>

  <footer class="site-footer"></footer>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/change-password.js"></script>
</body>
</html>

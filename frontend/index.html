<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh sách Sinh viên | PTIT StudentHub</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
</head>
<body>
  <!-- Header Navbar điều hướng -->
  <header class="site-header"></header>

  <main class="container">
    <!-- Hero / Tiêu đề trang -->
    <div class="page-header" style="text-align: center; margin-bottom: 2rem;">
      <h1 class="page-title" style="justify-content: center;">
        <span style="color: var(--color-primary);">🎓 Hồ Sơ Sinh Viên</span> PTIT
      </h1>
      <p class="page-subtitle">
        Khám phá thông tin, kỹ năng và kết nối với các tài năng sinh viên Học viện Công nghệ Bưu chính Viễn thông
      </p>
    </div>

    <!-- Thanh tìm kiếm và bộ lọc đa năng -->
    <div class="filter-bar">
      <!-- Tìm kiếm theo tên / mã SV -->
      <div class="search-box">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="text" 
          id="search-input" 
          class="form-control" 
          placeholder="Tìm theo họ tên hoặc mã SV..." 
          autocomplete="off"
        >
      </div>

      <!-- Lọc theo ngành -->
      <div>
        <select id="major-filter" class="form-select">
          <option value="">-- Tất cả ngành --</option>
        </select>
      </div>

      <!-- Lọc theo lớp -->
      <div>
        <select id="class-filter" class="form-select">
          <option value="">-- Tất cả lớp --</option>
        </select>
      </div>

      <!-- Sắp xếp -->
      <div>
        <select id="sort-select" class="form-select">
          <option value="newest">Mới nhất</option>
          <option value="name">Tên (A &rarr; Z)</option>
          <option value="class">Theo lớp</option>
        </select>
      </div>
    </div>

    <!-- Khu vực thông báo trạng thái: Đang tải / Rỗng / Lỗi -->
    <div id="status-message" class="status-message" style="display: none;"></div>

    <!-- Danh sách dạng lưới (Grid) -->
    <div id="student-grid" class="student-grid"></div>

    <!-- Vùng phân trang -->
    <div id="pagination" class="pagination-container"></div>
  </main>

  <!-- Footer -->
  <footer class="site-footer"></footer>

  <!-- Nạp file script đúng thứ tự: api.js -> common.js -> index.js -->
  <script src="/js/api.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/pages/index.js"></script>
</body>
</html>
